<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RetroQuest</title><style>
*{box-sizing:border-box}body{margin:0;background:#10101b;color:#f5f4ff;font:16px system-ui,sans-serif}header{background:#19192b;border-bottom:1px solid #39334e;padding:20px 5%;display:flex;align-items:center;gap:24px;flex-wrap:wrap}strong.logo{color:#ffd36b;font-size:26px;letter-spacing:2px}nav{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;color:inherit;background:#28263d;border:1px solid #494361;border-radius:8px;padding:10px 15px;cursor:pointer}button[aria-current=true],button:hover{background:#51418c}main{max-width:1200px;margin:auto;padding:32px 20px}.hero{padding:48px 30px;border:1px solid #594c86;border-radius:18px;background:linear-gradient(120deg,#252045,#17182c)}h1{font-size:clamp(32px,6vw,60px);margin:0 0 12px}p{color:#c1bed4;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:24px 0}.tile{background:#1c1c30;border:1px solid #39334e;border-radius:12px;padding:22px}.number{font-size:32px;color:#ffd36b}footer{text-align:center;color:#aaa5be;padding:24px}a{color:#ffd36b} .account{max-width:520px;margin:24px auto}.account label{display:block;margin:16px 0 6px}.account input{width:100%;padding:12px;background:#10101b;color:#fff;border:1px solid #615879;border-radius:8px;font:inherit}.account button{margin-top:16px}.account button:disabled{opacity:.6}.account .actions{display:flex;gap:8px;flex-wrap:wrap}.account [role=status]{min-height:24px} </style></head><body><header><strong class="logo">◈ RETROQUEST</strong><nav aria-label="Main navigation"></nav></header><main id="content"></main><footer>RetroQuest • Every game is a new quest.</footer><script>
const pages={Home:'',Games:'The game library is empty. Nintendo DS is the first planned platform.',Achievements:'Achievement sets will appear here when published.',Leaderboards:'Rankings will appear after verified achievement unlocks.',Community:'Community features are planned.',Account:''};
const nav=document.querySelector('nav'),content=document.querySelector('#content');function render(){const key=location.hash.slice(1);const page=Object.hasOwn(pages,key)?key:'Home';nav.replaceChildren();for(const name of Object.keys(pages)){const b=document.createElement('button');b.textContent=name;b.setAttribute('aria-current',String(name===page));b.onclick=()=>location.hash=name;nav.append(b)}content.replaceChildren();if(page==='Home'){content.innerHTML='<section class="hero"><p>YOUR NEXT ADVENTURE STARTS HERE</p><h1>Play. Unlock. Conquer.</h1><p>Discover a new way to experience classic games through achievements and challenges.</p><button id="browse">Explore games</button></section><section class="grid"><div class="tile"><div class="number">0</div>Published games</div><div class="tile"><div class="number">0</div>Published achievements</div><div class="tile"><div class="number">—</div>Player rankings</div></section><section class="tile"><h2>Platform roadmap</h2><p>Nintendo DS • Emulator integration • Player profiles • Achievement tracking</p><p>Development preview — live services are not connected.</p></section>';document.querySelector('#browse').onclick=()=>location.hash='Games'}else if(page==='Account'){showAccount()}else{const h=document.createElement('h1');h.textContent=page;const p=document.createElement('p');p.textContent=pages[page];content.append(h,p)}}async function api(path,body){const response=await fetch('/api/'+path,body===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw new Error(data.error||'Request failed');return data;}
async function showAccount(mode='login',notice=''){const panel=document.createElement('section');panel.className='tile account';content.replaceChildren(panel);panel.textContent='Loading account…';let player;try{({player}=await api('me'))}catch(e){panel.textContent='Account service unavailable. Please try again later.';return;}if(!panel.isConnected)return;
if(player){panel.replaceChildren();const h=document.createElement('h2');h.textContent=player.username;const p=document.createElement('p');p.textContent='Member since '+player.created_at.slice(0,10);const status=document.createElement('p');status.setAttribute('role','status');const b=document.createElement('button');b.textContent='Log out';b.onclick=async()=>{b.disabled=true;try{await api('logout',{});showAccount('login','Signed out.')}catch(e){status.textContent=e.message;b.disabled=false}};panel.append(h,p,b,status);return;}
const register=mode==='register';panel.innerHTML='<h2>'+ (register?'Create your RetroQuest account':'Welcome back')+'</h2><div class="actions"><button type="button" id="loginMode">Log in</button><button type="button" id="registerMode">Register</button></div><form>'+ (register?'<label for="username">Username</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+">':'')+'<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="'+(register?'new-password':'current-password')+'" required minlength="12" maxlength="128"><p>Use at least 12 characters.</p><button type="submit">'+(register?'Create account':'Log in')+'</button><p role="status" aria-live="polite"></p></form>';
panel.querySelector('#loginMode').onclick=()=>showAccount('login');panel.querySelector('#registerMode').onclick=()=>showAccount('register');const form=panel.querySelector('form'),status=form.querySelector('[role=status]'),submit=form.querySelector('button');status.textContent=notice;form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;status.textContent='Please wait…';try{await api(mode,Object.fromEntries(new FormData(form)));if(panel.isConnected)await showAccount();}catch(err){status.textContent=err.message;submit.disabled=false;}};}
window.addEventListener('hashchange',render);render();
</script></body></html>
