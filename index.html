<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RetroQuest</title><style>
*{box-sizing:border-box}body{margin:0;background:#10101b;color:#f5f4ff;font:16px system-ui,sans-serif}header{background:#19192b;border-bottom:1px solid #39334e;padding:20px 5%;display:flex;align-items:center;gap:24px;flex-wrap:wrap}strong.logo{color:#ffd36b;font-size:26px;letter-spacing:2px}nav{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;color:inherit;background:#28263d;border:1px solid #494361;border-radius:8px;padding:10px 15px;cursor:pointer}button[aria-current=true],button:hover{background:#51418c}main{max-width:1200px;margin:auto;padding:32px 20px}.hero{padding:48px 30px;border:1px solid #594c86;border-radius:18px;background:linear-gradient(120deg,#252045,#17182c)}h1{font-size:clamp(32px,6vw,60px);margin:0 0 12px}p{color:#c1bed4;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:24px 0}.tile{background:#1c1c30;border:1px solid #39334e;border-radius:12px;padding:22px}.number{font-size:32px;color:#ffd36b}footer{text-align:center;color:#aaa5be;padding:24px}a{color:#ffd36b} .account{max-width:520px;margin:24px auto}.account label{display:block;margin:16px 0 6px}.account input{width:100%;padding:12px;background:#10101b;color:#fff;border:1px solid #615879;border-radius:8px;font:inherit}.account button{margin-top:16px}.account button:disabled{opacity:.6}.account .actions{display:flex;gap:8px;flex-wrap:wrap}.account [role=status]{min-height:24px} </style></head><body><header><strong class="logo">◈ RETROQUEST</strong><nav aria-label="Main navigation"></nav></header><main id="content"></main><footer>RetroQuest • Every game is a new quest.</footer><script>
const pages={Home:'',Games:'The game library is empty. Nintendo DS is the first planned platform.',Achievements:'Achievement sets will appear here when published.',Leaderboards:'Rankings will appear after verified achievement unlocks.',Community:'Community features are planned.',Account:''};
const nav=document.querySelector('nav'),content=document.querySelector('#content');function render(){const key=location.hash.slice(1);const page=Object.hasOwn(pages,key)?key:'Home';nav.replaceChildren();for(const name of Object.keys(pages)){const b=document.createElement('button');b.textContent=name;b.setAttribute('aria-current',String(name===page));b.onclick=()=>location.hash=name;nav.append(b)}content.replaceChildren();if(page==='Home'){content.innerHTML='<section class="hero"><p>YOUR NEXT ADVENTURE STARTS HERE</p><h1>Play. Unlock. Conquer.</h1><p>Discover a new way to experience classic games through achievements and challenges.</p><button id="browse">Explore games</button></section><section class="grid"><div class="tile"><div class="number">0</div>Published games</div><div class="tile"><div class="number">0</div>Published achievements</div><div class="tile"><div class="number">—</div>Registered players</div></section><section class="tile"><h2>Platform roadmap</h2><p>Nintendo DS • Emulator integration • Player profiles • Achievement tracking</p><p>Achievement services are being prepared.</p></section>';document.querySelector('#browse').onclick=()=>location.hash='Games';const numbers=content.querySelectorAll('.number');api('stats').then(d=>{[d.games,d.achievements,d.players].forEach((v,i)=>numbers[i].textContent=v)}).catch(()=>numbers.forEach(n=>n.textContent='—'))}else if(page==='Account'){showAccount()}else if(page==='Community'){showCommunity()}else if(['Games','Achievements','Leaderboards'].includes(page)){showPublic(page)}else{const h=document.createElement('h1');h.textContent=page;const p=document.createElement('p');p.textContent=pages[page];content.append(h,p)}}async function api(path,body){const response=await fetch('/api/'+path,body===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw new Error(data.error||'Request failed');return data;}
async function showForum(id){const panel=document.createElement('section');panel.textContent='Loading forums…';content.replaceChildren(panel);try{const data=await api('forum'+(id?'?topic='+encodeURIComponent(id):''));if(!panel.isConnected)return;panel.replaceChildren();const back=document.createElement('button');back.textContent=id?'All topics':'Back to community';back.onclick=()=>id?showForum():render();const h=document.createElement('h1');h.textContent=id?data.topic.title:'Community forums';panel.append(back,h);function post(r){const card=document.createElement('article');card.className='tile';const name=document.createElement('strong');name.textContent=r.username+' · '+r.created_at;const body=document.createElement('p');body.style.whiteSpace='pre-wrap';body.textContent=r.body;card.append(name,body);panel.append(card)}if(id){post(data.topic);for(const r of data.replies)post(r)}else for(const r of data.topics){const b=document.createElement('button');b.textContent=r.title+' · '+r.username+' · '+r.replies+' replies';b.style.display='block';b.onclick=()=>showForum(r.id);panel.append(b)}const me=await api('me');if(!panel.isConnected)return;if(!me.player){const p=document.createElement('p');p.textContent='Log in to post.';panel.append(p);return}const form=document.createElement('form');form.className='account';form.innerHTML=(id?'':'<label for="topicTitle">Topic title</label><input id="topicTitle" name="title" maxlength="120" required>')+'<label for="forumBody">Message</label><textarea id="forumBody" name="body" required maxlength="4000" rows="5" style="width:100%"></textarea><button>Post</button><p role="status"></p>';panel.append(form);form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector('button');b.disabled=true;try{const payload=Object.fromEntries(new FormData(form));if(id)payload.topic=id;const result=await api('forum',payload);if(panel.isConnected)showForum(id||result.id)}catch(e){form.querySelector('[role=status]').textContent=e.message;b.disabled=false}}}catch(e){panel.textContent=e.message}}
async function showCommunity(){const panel=document.createElement('section');panel.innerHTML='<h1>Community</h1><p>Loading players and activity…</p>';content.append(panel);try{const data=await api('community');if(!panel.isConnected)return;panel.replaceChildren();const h=document.createElement('h1');h.textContent='Community';panel.append(h);const forums=document.createElement('button');forums.textContent='Community forums';forums.onclick=()=>showForum();panel.append(forums);const search=document.createElement('input');search.placeholder='Find a player';search.setAttribute('aria-label','Find a player');const grid=document.createElement('div');grid.className='grid';panel.append(search,grid);function draw(){grid.replaceChildren();for(const r of data.players.filter(r=>r.username.toLowerCase().includes(search.value.toLowerCase()))){const card=document.createElement('article');card.className='tile';const name=document.createElement('h2');name.textContent=r.username;const stats=document.createElement('p');stats.textContent=r.points+' points · '+r.unlocks+' achievements';const joined=document.createElement('p');joined.textContent='Member since '+r.created_at.slice(0,10);const view=document.createElement('button');view.textContent='View profile';view.onclick=()=>showProfile(r.username);card.append(name,stats,joined,view);grid.append(card)}}search.oninput=draw;draw();const title=document.createElement('h2');title.textContent='Recent achievement activity';panel.append(title);for(const r of data.activity){const p=document.createElement('p');p.textContent=r.username+' unlocked '+r.title+' in '+r.game+' · '+r.unlocked_at;panel.append(p)}if(!data.activity.length){const p=document.createElement('p');p.textContent='No achievement activity yet.';panel.append(p)}}catch(e){panel.textContent=e.message}}
function badge(url){const img=document.createElement('img');img.src=url;img.alt='Achievement badge';img.loading='lazy';img.referrerPolicy='no-referrer';img.style.cssText='width:72px;height:72px;object-fit:contain;border-radius:8px';img.onerror=()=>img.remove();return img}
async function showProfile(username){const panel=document.createElement('section');panel.textContent='Loading profile…';content.replaceChildren(panel);try{const data=await api('profile?username='+encodeURIComponent(username));if(!panel.isConnected)return;panel.replaceChildren();const back=document.createElement('button');back.textContent='Back to community';back.onclick=()=>render();const h=document.createElement('h1');h.textContent=data.username;const stats=document.createElement('p');stats.textContent=data.stats.points+' points · '+data.stats.unlocks+' achievements · Member since '+data.created_at.slice(0,10);panel.append(back,h,stats);const grid=document.createElement('div');grid.className='grid';for(const r of data.activity){const card=document.createElement('article');card.className='tile';if(r.badge_url)card.append(badge(r.badge_url));const title=document.createElement('h3');title.textContent=r.title;const p=document.createElement('p');p.textContent=r.game+' · '+r.points+' points · '+r.unlocked_at;card.append(title,p);grid.append(card)}if(!data.activity.length)grid.textContent='No achievements unlocked yet.';panel.append(grid)}catch(e){panel.textContent=e.message}}
async function showPublic(page){const panel=document.createElement('section');const heading=document.createElement('h1');heading.textContent=page;const status=document.createElement('p');status.textContent='Loading…';panel.append(heading,status);content.append(panel);try{const data=await api(page==='Leaderboards'?'leaderboards':'library');if(!panel.isConnected)return;const rows=page==='Games'?data.games:page==='Achievements'?data.achievements:data.players;status.textContent=rows.length?(page==='Leaderboards'?'Top 100 players by achievement points':data.signedIn?'Your completion progress is shown below.':'Log in to see your completion progress.') : page==='Leaderboards'?'No ranked players yet.':'Nothing published yet. Check back when RetroQuest launches.';const search=document.createElement('input');search.placeholder='Search '+page.toLowerCase();search.setAttribute('aria-label',search.placeholder);search.style.cssText='width:100%;padding:12px;background:#19192b;color:white;border:1px solid #494361;border-radius:8px';const grid=document.createElement('div');grid.className='grid';if(rows.length)panel.append(search,grid);function draw(){grid.replaceChildren();const q=search.value.toLowerCase();for(const [i,r] of rows.entries()){if(![r.title,r.console,r.game,r.username].filter(Boolean).join(' ').toLowerCase().includes(q))continue;const card=document.createElement('article');card.className='tile';const title=document.createElement('h2');title.textContent=page==='Leaderboards'?'#'+(i+1)+' '+r.username:r.title;const info=document.createElement('p');info.textContent=page==='Games'?r.console+' · '+r.total+' achievements':page==='Achievements'?r.game+' · '+r.points+' points':r.points+' points · '+r.unlocks+' unlocks';card.append(title,info);if(page==='Games'){const progress=document.createElement('progress');progress.max=r.total||1;progress.value=r.unlocked;progress.style.width='100%';progress.setAttribute('aria-label','Completion');const label=document.createElement('p');label.textContent=r.unlocked+'/'+r.total+' unlocked'+(r.total&&r.unlocked===r.total?' · Complete':'');card.append(progress,label)}if(page==='Achievements'){const desc=document.createElement('p');desc.textContent=r.description;const state=document.createElement('strong');state.textContent=r.unlocked?'🏆 Unlocked':'🔒 Locked';if(r.badge_url)card.prepend(badge(r.badge_url));card.append(desc,state)}grid.append(card)}}search.oninput=draw;draw()}catch(e){status.textContent=e.message}}
function showSettings(panel){panel.replaceChildren();const h=document.createElement('h2');h.textContent='Account settings';const back=document.createElement('button');back.textContent='Back';back.onclick=()=>showAccount();const form=document.createElement('form');form.innerHTML='<label for="current">Current password</label><input id="current" name="current" type="password" autocomplete="current-password" required maxlength="128"><label for="newpass">New password</label><input id="newpass" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><button>Change password</button><p role="status"></p>';panel.append(h,back,form);const em=document.createElement('section');em.className='tile';const et=document.createElement('h3');et.textContent='Emulator connection';const note=document.createElement('p');note.textContent='Generate a private 30-day emulator token. Creating a new token replaces the old one.';const create=document.createElement('button');create.textContent='Generate token';const revoke=document.createElement('button');revoke.textContent='Revoke token';const output=document.createElement('textarea');output.readOnly=true;output.hidden=true;output.setAttribute('aria-label','Private emulator token');output.style.width='100%';const msg=document.createElement('p');msg.setAttribute('role','status');async function tokenAction(action){create.disabled=revoke.disabled=true;output.hidden=true;output.value='';try{const d=await api('emulator/token',{action});if(d.token){output.value=d.token;output.hidden=false;msg.textContent='Copy this token into your trusted emulator client. Do not share it.'}else msg.textContent='Token revoked.'}catch(e){msg.textContent=e.message}finally{create.disabled=revoke.disabled=false}}create.onclick=()=>tokenAction('create');revoke.onclick=()=>tokenAction('revoke');em.append(et,note,create,revoke,output,msg);panel.append(em);form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector('button'),status=form.querySelector('[role=status]');b.disabled=true;try{await api('account/password',Object.fromEntries(new FormData(form)));form.reset();status.textContent='Password changed. Other sessions signed out.'}catch(e){status.textContent=e.message}finally{b.disabled=false}}}
async function showAccount(mode='login',notice=''){const panel=document.createElement('section');panel.className='tile account';content.replaceChildren(panel);panel.textContent='Loading account…';let player;try{({player}=await api('me'))}catch(e){panel.textContent='Account service unavailable. Please try again later.';return;}if(!panel.isConnected)return;
if(player){panel.replaceChildren();const h=document.createElement('h2');h.textContent=player.username;const p=document.createElement('p');p.textContent='Member since '+player.created_at.slice(0,10);const status=document.createElement('p');status.setAttribute('role','status');const b=document.createElement('button');b.textContent='Log out';b.onclick=async()=>{b.disabled=true;try{await api('logout',{});showAccount('login','Signed out.')}catch(e){status.textContent=e.message;b.disabled=false}};panel.append(h,p,b,status);const settings=document.createElement('button');settings.textContent='Account settings';settings.onclick=()=>showSettings(panel);panel.append(settings);if(player.owner){const owner=document.createElement('button');owner.textContent='Owner dashboard';owner.onclick=()=>showOwner(panel);panel.append(owner);}return;}
const register=mode==='register';panel.innerHTML='<h2>'+ (register?'Create your RetroQuest account':'Welcome back')+'</h2><div class="actions"><button type="button" id="loginMode">Log in</button><button type="button" id="registerMode">Register</button></div><form>'+ (register?'<label for="username">Username</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+">':'')+'<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="'+(register?'new-password':'current-password')+'" required minlength="12" maxlength="128"><p>Use at least 12 characters.</p><button type="submit">'+(register?'Create account':'Log in')+'</button><p role="status" aria-live="polite"></p></form>';
panel.querySelector('#loginMode').onclick=()=>showAccount('login');panel.querySelector('#registerMode').onclick=()=>showAccount('register');const form=panel.querySelector('form'),status=form.querySelector('[role=status]'),submit=form.querySelector('button');status.textContent=notice;form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;status.textContent='Please wait…';try{await api(mode,Object.fromEntries(new FormData(form)));if(panel.isConnected)await showAccount();}catch(err){status.textContent=err.message;submit.disabled=false;}};}
async function showOwner(panel){try{const data=await api('owner/overview');if(!panel.isConnected)return;panel.replaceChildren();const h=document.createElement('h2');h.textContent='Owner dashboard';panel.append(h);const back=document.createElement('button');back.textContent='Back to account';back.onclick=()=>showAccount();panel.append(back);const toggle=document.createElement('button');let maintenance=data.maintenance;const label=()=>toggle.textContent=maintenance?'Maintenance: ON — reopen registration':'Maintenance: OFF — close registration';label();toggle.onclick=async()=>{toggle.disabled=true;try{const result=await api('owner/maintenance',{maintenance:!maintenance});maintenance=result.maintenance;label();refreshStatus()}catch(e){alert(e.message)}finally{toggle.disabled=false}};panel.append(toggle);for(const [key,value] of Object.entries(data.counts)){const p=document.createElement('p');p.textContent=key+': '+value;panel.append(p)}const manage=document.createElement('button');manage.textContent='Manage players';manage.onclick=()=>managePlayers(panel);panel.append(manage);const catalog=document.createElement('button');catalog.textContent='Catalog manager';catalog.onclick=()=>manageCatalog(panel);panel.append(catalog);const title=document.createElement('h3');title.textContent='Recent players (up to 100)';panel.append(title);for(const user of data.players){const p=document.createElement('p');p.textContent=user.username+' · '+user.created_at.slice(0,10);panel.append(p)}}catch(e){const p=document.createElement('p');p.textContent=e.message;panel.append(p)}}
async function editConditions(panel,row){panel.replaceChildren();const h=document.createElement('h2');h.textContent='Memory conditions: '+row.title;const back=document.createElement('button');back.textContent='Back to catalog';back.onclick=()=>manageCatalog(panel);const note=document.createElement('p');note.textContent='All conditions must match. Unsigned little-endian values. Test with simulated memory values; this does not award achievements.';panel.append(h,back,note);try{const data=await api('owner/conditions?id='+encodeURIComponent(row.id));if(!panel.isConnected)return;const form=document.createElement('form'),list=document.createElement('div'),status=document.createElement('p');status.setAttribute('role','status');function add(c={address:0,bytes:1,op:'eq',value:0}){if(list.children.length>=32)return;const card=document.createElement('section');card.className='tile';function field(label,name,value){const l=document.createElement('label');l.textContent=label;const i=document.createElement('input');i.name=name;i.value=value;i.required=true;l.append(i);card.append(l);return i}field('Address (hex or decimal)','address','0x'+c.address.toString(16));const size=document.createElement('select');size.name='bytes';for(const n of [1,2,4])size.add(new Option(n*8+' bit',n));size.value=c.bytes;const op=document.createElement('select');op.name='op';for(const [v,l] of [['eq','='],['ne','≠'],['gt','>'],['gte','≥'],['lt','<'],['lte','≤']])op.add(new Option(l,v));op.value=c.op;card.append(size,op);field('Required value','value',c.value);field('Simulated current value','sample',0);const remove=document.createElement('button');remove.type='button';remove.textContent='Remove condition';remove.onclick=()=>card.remove();card.append(remove);list.append(card)}for(const c of data.definition?.conditions||[undefined])add(c);const more=document.createElement('button');more.type='button';more.textContent='Add condition';more.onclick=()=>add();const test=document.createElement('button');test.type='button';test.textContent='Test conditions';const save=document.createElement('button');save.textContent='Save draft conditions';save.disabled=!!row.published;function read(){return Array.from(list.children,card=>{const v=n=>card.querySelector('[name='+n+']').value;const c={address:Number(v('address')),bytes:Number(v('bytes')),op:v('op'),value:Number(v('value')),sample:Number(v('sample'))};if(!v('address').trim()||!v('value').trim()||!v('sample').trim()||!Number.isInteger(c.address)||c.address<0||c.address+c.bytes>4294967296||![c.value,c.sample].every(n=>Number.isInteger(n)&&n>=0&&n<2**(8*c.bytes)))throw Error('Invalid address or value');return c})}test.onclick=()=>{try{const rows=read();if(!rows.length)throw Error('Add a condition');const match=rows.every(c=>({eq:c.sample===c.value,ne:c.sample!==c.value,gt:c.sample>c.value,gte:c.sample>=c.value,lt:c.sample<c.value,lte:c.sample<=c.value})[c.op]);status.textContent=match?'Test passed: all conditions match.':'Test failed: conditions not met.'}catch(e){status.textContent=e.message}};form.onsubmit=async e=>{e.preventDefault();try{const conditions=read().map(({sample,...c})=>c);await api('owner/conditions',{id:row.id,definition:{version:1,conditions}});status.textContent='Draft conditions saved.'}catch(e){status.textContent=e.message}};form.append(list,more,test,save,status);panel.append(form)}catch(e){note.textContent=e.message}}
async function manageCatalog(panel){panel.replaceChildren();const h=document.createElement('h2');h.textContent='Catalog manager';const back=document.createElement('button');back.textContent='Back to dashboard';back.onclick=()=>showOwner(panel);panel.append(h,back);try{const data=await api('owner/catalog');if(!panel.isConnected)return;for(const type of ['console','game','achievement']){const section=document.createElement('section');section.className='tile';const title=document.createElement('h3');title.textContent=({console:'Console Manager',game:'Game Manager',achievement:'Achievement Creator'})[type];section.append(title);const rows=data[type+'s'];for(const row of rows){const p=document.createElement('p');p.textContent=(row.name||row.title)+(type==='console'?'':row.published?' · Published':' · Draft');section.append(p);const controls=document.createElement('div');async function change(action,extra={}){try{await api('owner/catalog/update',{type,id:row.id,action,...extra});if(panel.isConnected)await manageCatalog(panel)}catch(e){alert(e.message)}}function button(label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;controls.append(b)}button('Rename',()=>{const title=prompt('New name',row.name||row.title);if(title&&title.trim())change('rename',{title})});if(type==='game')button('Add ROM fingerprint',async()=>{const sha256=prompt('ROM SHA-256 (64 hexadecimal characters)');if(!sha256)return;try{await api('owner/fingerprint',{game_id:row.id,sha256:sha256.trim()});alert('Fingerprint saved.')}catch(e){alert(e.message)}});if(type==='achievement')button('Memory conditions',()=>editConditions(panel,row));if(type==='achievement')button('Edit details',()=>{const description=prompt('Description',row.description);if(description===null)return;const points=prompt('Points',row.points);if(points===null)return;const badge_url=prompt('HTTPS badge image URL (optional)',row.badge_url||'');if(badge_url===null)return;change('edit',{description,points:Number(points),badge_url})});if(type!=='console')button(row.published?'Unpublish':'Publish',()=>{if(confirm('Change publication status?'))change('publish',{published:!row.published})});button('Delete',()=>{if(confirm('Delete '+(row.name||row.title)+'?'))change('delete')});section.append(controls)}if(!rows.length){const p=document.createElement('p');p.textContent='No entries yet.';section.append(p)}const form=document.createElement('form');function field(name,label,kind='text',max=200){const l=document.createElement('label');l.textContent=label;const i=document.createElement('input');i.name=name;i.type=kind;i.required=true;i.id='catalog-'+type+'-'+name;l.htmlFor=i.id;if(kind==='number'){i.min=1;i.max=1000;i.step=1}else i.maxLength=max;form.append(l,i)}function select(name,label,items){const l=document.createElement('label');l.textContent=label;const el=document.createElement('select');el.name=name;el.id='catalog-'+type+'-'+name;l.htmlFor=el.id;el.required=true;el.style.cssText='width:100%;padding:12px;background:#10101b;color:white';const empty=document.createElement('option');empty.value='';empty.textContent='Select…';el.append(empty);for(const row of items){const o=document.createElement('option');o.value=row.id;o.textContent=row.name||row.title;el.append(o)}form.append(l,el)}if(type==='console')field('name','Console name','text',100);else{field('title','Title');if(type==='game')select('console_id','Console',data.consoles);else{select('game_id','Game',data.games);field('description','Achievement description','text',1000);field('points','Points','number')}}const submit=document.createElement('button');submit.textContent=type==='console'?'Add console':'Create draft';submit.disabled=type==='achievement'&&!data.games.length;const status=document.createElement('p');status.setAttribute('role','status');form.append(submit,status);form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;const body={type,...Object.fromEntries(new FormData(form))};if(type==='achievement')body.points=Number(body.points);try{await api('owner/catalog',body);if(panel.isConnected)await manageCatalog(panel)}catch(e){status.textContent=e.message;submit.disabled=false}};section.append(form);panel.append(section)}}catch(e){const p=document.createElement('p');p.textContent=e.message;panel.append(p)}}
async function managePlayers(panel){panel.replaceChildren();const h=document.createElement('h2');h.textContent='Player management';const back=document.createElement('button');back.textContent='Back to dashboard';back.onclick=()=>showOwner(panel);const form=document.createElement('form');form.innerHTML='<label for="playerSearch">Search username</label><input id="playerSearch" maxlength="100"><button>Search</button>';const results=document.createElement('div');results.setAttribute('aria-live','polite');panel.append(h,back,form,results);let seq=0;async function load(){const n=++seq;results.textContent='Loading…';try{const data=await api('owner/players?q='+encodeURIComponent(form.querySelector('input').value));if(n!==seq||!results.isConnected)return;results.replaceChildren();if(!data.players.length)results.textContent='No players found.';for(const player of data.players){const card=document.createElement('section');card.className='tile';const title=document.createElement('h3');title.textContent=player.username;const info=document.createElement('p');info.textContent=(player.suspended?'Suspended':'Active')+' · '+player.points+' points · '+player.unlocks+' unlocks';const button=document.createElement('button');button.textContent=player.suspended?'Restore account':'Suspend account';button.onclick=async()=>{if(!confirm(button.textContent+' for '+player.username+'?'))return;button.disabled=true;try{await api('owner/suspend',{id:player.id,suspended:!player.suspended});await load()}catch(e){alert(e.message);button.disabled=false}};card.append(title,info,button);results.append(card)}}catch(e){if(n===seq)results.textContent=e.message}}form.onsubmit=e=>{e.preventDefault();load()};load();}
const banner=document.createElement('p');banner.style.cssText='margin:0;padding:12px;text-align:center;background:#473a16;color:#ffd36b';banner.hidden=true;document.querySelector('header').after(banner);async function refreshStatus(){try{const data=await api('status');banner.hidden=!data.maintenance;banner.textContent='RetroQuest is under maintenance. New registrations are temporarily closed.'}catch{}}refreshStatus();window.addEventListener('hashchange',render);render();
</script></body></html>
