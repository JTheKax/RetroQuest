name: RetroQuest checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: node --check src/worker.js
      - run: node --test tests/achievement-engine.test.js tests/emulator-client.test.js
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile native bridge smoke test
        shell: cmd
        run: cl /std:c++17 /EHsc clients\melonds\bridge_test.cpp /Fe:RetroQuestBridgeTest.exe
      - name: Run native smoke test
        shell: cmd
        run: RetroQuestBridgeTest.exe
      - uses: actions/upload-artifact@v4
        with:
          name: RetroQuest-Windows-Bridge-Test
          path: RetroQuestBridgeTest.exe
